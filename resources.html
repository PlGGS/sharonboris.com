<!-- handouts, books, websites, apps -->

<section class="page-banner">
    <div class="container">
        <h1>Resources</h1>
    </div>
</section>
<section id="forms" class="forms">
    <script>
        /*
         * Creates download cards for each file located at https://api.github.com/repos/plggs/sharonboris.com/contents/files/ + dir
         * @param string dir The directory name to pull file names from
         */
        function getFileBubbles(dir) {
            fetch('https://api.github.com/repos/plggs/sharonboris.com/contents/files/' + dir)
                .then(function (response) { return response.json(); })
                .then(function (data) {
                    let containerForms = [];

                    //add files in reverse order as of mom's request
                    for (let file of data) {
                        let name = file.name.replace(/\.pdf$/i, '').trim();
                        containerForms.unshift(
                            `<a class="file-card" href="/${file.path}" target="_blank" rel="noopener noreferrer">` +
                                '<span class="file-icon"><i class="fa-solid fa-file-pdf" aria-hidden="true"></i></span>' +
                                `<span class="file-name">${name}</span>` +
                                '<i class="fa-solid fa-arrow-down file-arrow" aria-hidden="true"></i>' +
                            '</a>'
                        );
                    }

                    // insert before any static links already in the grid (e.g. Florida Telehealth Resources)
                    document.getElementById(dir).insertAdjacentHTML('afterbegin', containerForms.join(''));
                });
        }
    </script>
    <div class="container">
        <div class="form-group">
            <div class="form-group-head">
                <span class="form-group-icon"><i class="fa-solid fa-user-plus" aria-hidden="true"></i></span>
                <h2>New Clients</h2>
            </div>
            <div class="file-grid" id="new-patient"></div>
            <script>
                getFileBubbles('new-patient');
            </script>
        </div>
        <div class="form-group">
            <div class="form-group-head">
                <span class="form-group-icon"><i class="fa-solid fa-laptop-medical" aria-hidden="true"></i></span>
                <h2>Telehealth</h2>
            </div>
            <div class="file-grid" id="telehealth">
                <a class="file-card file-card-link" href="https://flhealthsource.gov/telehealth/" target="_blank" rel="noopener noreferrer">
                    <span class="file-icon"><i class="fa-solid fa-globe" aria-hidden="true"></i></span>
                    <span class="file-name">Florida Telehealth Resources</span>
                    <i class="fa-solid fa-arrow-up-right-from-square file-arrow" aria-hidden="true"></i>
                </a>
            </div>
            <script>
                getFileBubbles('telehealth');
            </script>
        </div>
    </div>
</section>
